# Remote builder for the bl-24e7 speculative merge queue (bl-6312, design
# docs/design/bl-24e7-speculative-merge-queue.md).
#
# The contract is the verdict store's own file format — no workflow-specific
# protocol exists. Push a candidate commit to a `speculation/**` branch and
# this job runs the gate on it, records the verdict into the runner's local
# store exactly as a laptop would, and the store dir ships home as an
# artifact. Retrieval is symmetric and manual by design (a remote builder
# must never become a close dependency):
#
#     gh run download -n verdicts -D /tmp/verdicts
#     bl-speculate import /tmp/verdicts/*.toml   # an empty artifact = no verdict: rebuild
#     git push origin --delete speculation/<name>   # the TTL sweep is you
#
# The gate here is `scripts/check` — the sequence with a three-word exit that
# `make check` is a door onto — and this job records the verdict itself
# (bl-b650, yog's pattern). Not scripts/pre-commit: on a laptop that file
# execs bl-gate (userconf), which ships the tree to the noodlezoo builder —
# the per-commit gate — and no GitHub runner has it. The recorder is this
# tree's own bl-speculate, built here: balls is the crate that ships it.
#
# Two honesty notes. (1) A verdict is keyed by (tree, gate); the gate half is
# BALLS_TOOLCHAIN, `rustc -V`, which rust-toolchain.toml pins on every side —
# a verdict recorded here HITS locally only while the pin is the same on both,
# and a mismatch is not a bug, it is the fingerprint refusing to vouch across
# toolchains. (2) Public-repo standard runners are free with no minutes
# quota; the real caps are 20 concurrent jobs (Free plan) and 6 h per job.
name: speculate
on:
  push:
    branches:
      - 'speculation/**'
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the gate fingerprint (rust-toolchain.toml pins it on every side)
        run: rustc -V
      - name: the gate's own tooling
        run: cargo install cargo-tarpaulin --version 0.35.2 --locked
      - name: build the recorder
        run: cargo build --release --bin bl-speculate
      # A verdict is recorded ONLY when the gate judged the tree, and its exit
      # code says so (bl-988d, from yog bl-673a). 75 is check-coverage.sh
      # reporting tarpaulin signaled on both attempts: an infrastructure death,
      # not a verdict — and a stored FAIL is permanent (keyed by tree, the
      # speculator stops the chain at it without rebuilding). So 75 records
      # nothing, and a job killed outright writes no output: also nothing.
      # `scripts/check`, not `make check`: make reports a recipe's 75 as its
      # own exit 2, and the distinction this step exists for would be gone.
      - name: run the gate (scripts/check — three exit words)
        id: gate
        run: |
          set +e
          scripts/check
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "verdict=pass" >>"$GITHUB_OUTPUT"
          elif [ "$code" -eq 75 ]; then
            echo "the gate produced NO verdict about this tree; nothing is recorded (bl-988d)" >&2
          else
            echo "verdict=fail" >>"$GITHUB_OUTPUT"
          fi
          exit "$code"
      - name: record the verdict (BALLS_TOOLCHAIN is the gate half of the key)
        if: always() && (steps.gate.outputs.verdict == 'pass' || steps.gate.outputs.verdict == 'fail')
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
        run: PATH="$PWD/target/release:$PATH" BALLS_IDENTITY=github-actions BALLS_TOOLCHAIN="$(rustc -V)" bl-speculate record "$VERDICT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdicts
          path: ~/.local/state/balls/plugins/bl-speculate/verdicts/
